<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldView Atlas</title>
<meta name="description" content="WorldView Atlas: an interactive world map with country profiles, India-lens strategic layers (Quad, BRICS, SCO, IMEC, chokepoints) and an English, Hindi and Marathi interface.">
<meta property="og:title" content="WorldView Atlas">
<meta property="og:description" content="Click any country for a structured profile. Switch on the India Lens for groupings, corridors and maritime chokepoints.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#08111d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.WV_BASE="data/";if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Devanagari+Marathi&display=swap">
<style>
/* Layout: full-bleed chart-room map; floating glass control panel left, profile drawer right (bottom sheet on phones) */
:root{
  --bg:#eef2f5; --sea:#d5e2ea; --land:#fbfcfd; --line:#9bb0c2; --grat:#c4d4df;
  --fg:#122230; --muted:#566a7c; --faint:#8396a7;
  --panel:rgba(250,252,253,.86); --panel-solid:#f8fafb; --edge:rgba(18,34,48,.12); --chip:#e3eaf0;
  --accent:#b85a07; --accent-soft:rgba(184,90,7,.14); --accent-fg:#fff;
  --green:#18794e; --navy:#1d3a5f; --corr:#0f7a72; --corr2:#6a4fc4; --lane:#5c7a93;
  --seq0:#e7edf2; --seq1:#1d4e7a;
  --r-af:#c58b52; --r-am:#5a8db5; --r-as:#c46b5e; --r-eu:#7c8fc9; --r-oc:#4ea38c; --r-an:#a7b4bf;
  --shadow:0 10px 30px rgba(18,34,48,.14);
  --f-display:"Tiro Devanagari Hindi","Iowan Old Style","Georgia",serif;
  --f-body:"Mukta","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --hdr:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111d; --sea:#0c1828; --land:#18283c; --line:#34506d; --grat:#14243a;
  --fg:#e5edf5; --muted:#93a8bd; --faint:#647c93;
  --panel:rgba(14,26,42,.84); --panel-solid:#0f1d2f; --edge:rgba(229,237,245,.12); --chip:#1c2f46;
  --accent:#f2a246; --accent-soft:rgba(242,162,70,.18); --accent-fg:#1a1004;
  --green:#45c08a; --navy:#9cc1e8; --corr:#3cc7b8; --corr2:#a996f2; --lane:#7d9bb6;
  --seq0:#1a2b40; --seq1:#9ccdf2;
  --r-af:#b9874f; --r-am:#5f93bd; --r-as:#c7766a; --r-eu:#8494d0; --r-oc:#51a891; --r-an:#5a6c7d;
  --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111d; --sea:#0c1828; --land:#18283c; --line:#34506d; --grat:#14243a;
  --fg:#e5edf5; --muted:#93a8bd; --faint:#647c93;
  --panel:rgba(14,26,42,.84); --panel-solid:#0f1d2f; --edge:rgba(229,237,245,.12); --chip:#1c2f46;
  --accent:#f2a246; --accent-soft:rgba(242,162,70,.18); --accent-fg:#1a1004;
  --green:#45c08a; --navy:#9cc1e8; --corr:#3cc7b8; --corr2:#a996f2; --lane:#7d9bb6;
  --seq0:#1a2b40; --seq1:#9ccdf2;
  --r-af:#b9874f; --r-am:#5f93bd; --r-as:#c7766a; --r-eu:#8494d0; --r-oc:#51a891; --r-an:#5a6c7d;
  --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}
:lang(mr) {--f-display:"Tiro Devanagari Marathi","Tiro Devanagari Hindi","Georgia",serif}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header */
.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));min-height:var(--hdr);background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 70%,transparent));}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em}
.brand b i{color:var(--accent);font-style:normal}
.brand span{color:var(--muted);font-size:13px}
.search{position:relative;flex:1;max-width:520px;margin-inline:auto}
.search input{width:100%;padding:9px 14px 9px 38px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--edge);border-radius:5px;padding:0 5px}
#qres{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;background:var(--panel-solid);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);max-height:360px;overflow:auto}
#qres li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;cursor:pointer}
#qres li[aria-selected="true"],#qres li:hover{background:var(--accent-soft)}
#qres li small{color:var(--muted);margin-left:auto;font-family:var(--f-mono);font-size:11px}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;background:var(--panel);padding:2px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Map */
#stage{position:fixed;inset:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.ctry{stroke:var(--line);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .35s,opacity .25s;cursor:pointer}
.ctry:hover{stroke:var(--fg);stroke-width:1.2}
.ctry.sel{stroke:var(--accent);stroke-width:2.2}
.ctry.dim{opacity:.35}
.ctry.special{fill-opacity:.55}
.lane{fill:none;stroke:var(--lane);stroke-width:1.4;stroke-dasharray:2 4;vector-effect:non-scaling-stroke;opacity:.9}
.leg-sea{fill:none;stroke:var(--corr);stroke-width:2.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.leg-rail{fill:none;stroke:var(--corr);stroke-width:2.6;vector-effect:non-scaling-stroke}
.instc .leg-sea,.instc .leg-rail{stroke:var(--corr2)}
.choke circle.core{fill:var(--accent);stroke:var(--bg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.choke circle.ring{fill:none;stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.6;animation:pulse 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.choke{cursor:pointer}
.port circle{fill:var(--corr2);stroke:var(--bg);stroke-width:1.2;vector-effect:non-scaling-stroke}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.choke circle.ring{animation:none}.ctry{transition:none}}
#tip{position:fixed;z-index:25;pointer-events:none;background:var(--panel-solid);border:1px solid var(--edge);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:13px;max-width:280px}
#tip b{display:block;font-weight:600}
#tip span{color:var(--muted)}
.mapctl{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:6px}
#legend{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:12px;min-width:220px;max-width:min(320px,calc(100vw - 32px));box-shadow:var(--shadow)}
#legend h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#legend .ramp{height:9px;border-radius:5px}
#legend .ends{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--f-mono);font-size:11px}
#legend .cats{display:flex;flex-wrap:wrap;gap:4px 12px}
#legend .cats i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#legend .src{margin-top:6px;color:var(--faint);font-size:11px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:19;color:var(--muted);font-size:13px;background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:5px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* Left panel */
#panel{position:fixed;z-index:22;left:16px;top:calc(var(--hdr) + 12px + env(safe-area-inset-top,0px));width:328px;max-height:calc(100% - var(--hdr) - 210px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ptabs{display:flex;border-bottom:1px solid var(--edge)}
.ptabs button{flex:1;border:0;background:none;padding:10px 6px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent);font-weight:600}
.ptabs button.lensTab[aria-selected="true"]{color:var(--accent)}
.pbody{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.lensc[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .x{opacity:.6}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--chip);border:1px solid var(--edge);position:relative;flex:none;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:transform .2s,background .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(14px);background:var(--accent-fg)}
.swatch{width:18px;height:3px;border-radius:2px;display:inline-block;margin-left:auto}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.list{display:flex;flex-direction:column}
.list button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:7px 4px;border-bottom:1px solid var(--edge)}
.list button:hover{background:var(--accent-soft)}
.list button span{flex:1;min-width:0}
.list button small{color:var(--muted);font-size:12px;display:block;line-height:1.35}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx th{font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--edge);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel-solid)}
table.mx td{padding:5px 4px;border-bottom:1px solid var(--edge)}
table.mx tr{cursor:pointer}
table.mx tr:hover td{background:var(--accent-soft)}
.mxwrap{max-height:280px;overflow:auto;border:1px solid var(--edge);border-radius:10px}
.lex{display:flex;flex-direction:column;gap:8px}
.lex div{border-bottom:1px solid var(--edge);padding-bottom:7px}
.lex b{display:block;font-weight:600;font-size:13.5px}
.lex span{font-size:13.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-1px)}

/* Drawer */
#drawer{position:fixed;z-index:28;top:calc(var(--hdr) + 8px + env(safe-area-inset-top,0px));right:16px;bottom:16px;width:min(560px,calc(100vw - 32px));display:flex;flex-direction:column;background:var(--panel-solid);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;transform:translateX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#drawer.closing{transform:translateX(110%);opacity:0}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.hero{position:relative;padding:18px 20px 14px;overflow:hidden;border-bottom:1px solid var(--edge);flex:none}
.hero .bgflag{position:absolute;inset:-30%;filter:blur(38px) saturate(1.2);opacity:.32;pointer-events:none}
.hero .bgflag img{width:100%;height:100%;object-fit:cover;max-width:none}
.hero .row{position:relative;display:flex;gap:16px;align-items:center}
.flagbox{width:92px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none;background:var(--chip);display:grid;place-items:center;font-size:44px;max-width:100%}
.flagbox img{width:100%;height:100%;display:block;object-fit:cover}
.flagbox.wave img{animation:wave 5s ease-in-out infinite;transform-origin:left center}
@keyframes wave{0%,100%{transform:perspective(300px) rotateY(0) skewY(0)}50%{transform:perspective(300px) rotateY(-9deg) skewY(1.5deg)}}
@media (prefers-reduced-motion:reduce){.flagbox.wave img{animation:none}}
.hero h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;text-wrap:balance}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hero .acts{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.act{border:1px solid var(--edge);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--fg)}
.act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.act[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.act[aria-pressed="true"] svg{fill:currentColor}
.closeX{position:absolute;right:12px;top:12px;z-index:2}
.stats{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 10px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500;overflow-wrap:anywhere;line-height:1.25;margin-top:2px}
.stat .y{font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.dtabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--edge);flex:none;scrollbar-width:thin}
.dtabs button{border:0;background:none;padding:10px 10px;font-size:13.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button[aria-selected="true"]{color:var(--fg);border-color:var(--fg);font-weight:600}
.dtabs button.lensTab{color:var(--accent)}
.dtabs button.lensTab[aria-selected="true"]{border-color:var(--accent)}
.dbody{overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px;flex:1;min-height:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec>h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:500;border-radius:999px;padding:1px 8px;border:1px solid var(--edge);color:var(--muted);background:var(--chip)}
.badge.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.badge.warn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:0;border-top:1px solid var(--edge)}
dl.kv dt,dl.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--edge);min-width:0}
dl.kv dt{color:var(--muted);font-size:13px;padding-right:12px}
dl.kv dd{font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.morebtn{border:0;background:none;color:var(--accent);padding:2px 0;font-size:12.5px;font-weight:600}
.prose{font-size:15px;line-height:1.6;max-width:65ch;white-space:pre-line}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:13px}
.bar .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .p{font-family:var(--f-mono);text-align:right;font-size:12px}
.bar .track{grid-column:1/-1;height:6px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar .fill{height:100%;background:var(--navy);border-radius:4px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .ln{fill:none;stroke:var(--navy);stroke-width:2}
.chart .ar{fill:var(--navy);opacity:.12}
.chart .gd{stroke:var(--edge);stroke-width:1}
.chart .end{fill:var(--accent)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--edge);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--panel-solid);border:2px solid var(--accent)}
.tl .yr{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.city{border:1px solid var(--edge);border-radius:12px;padding:9px 11px;min-width:0}
.city b{display:block;font-weight:600}
.city span{font-size:12.5px;color:var(--muted)}
.empty{border:1px dashed var(--edge);border-radius:14px;padding:16px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.lensbox{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13.5px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mg{border:1px solid var(--edge);border-radius:12px;padding:10px 12px;min-width:0}
.mg .k{font-size:11.5px;color:var(--muted)}
.mg .v{font-family:var(--f-mono);font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.mg .v.txt{font-family:var(--f-body);font-size:15px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--chip),var(--edge),var(--chip));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{font-size:11.5px;color:var(--faint);border-top:1px solid var(--edge);padding-top:12px}
.err{border:1px solid var(--accent);border-radius:12px;padding:12px;font-size:14px}

/* Compare */
#tray{position:fixed;z-index:29;left:50%;transform:translateX(-50%);top:calc(var(--hdr) + 12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;background:var(--panel-solid);border:1px solid var(--edge);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);flex-wrap:wrap}
.primary{border:0;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px}
.primary:disabled{opacity:.45;cursor:default}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,10,18,.5);display:grid;place-items:center;padding:16px}
.mcard{background:var(--panel-solid);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;position:relative}
.mcard h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 12px}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab th,.ctab td{padding:9px 10px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:top}
.ctab thead th{font-family:var(--f-display);font-weight:400;font-size:20px}
.ctab tbody th{color:var(--muted);font-weight:500;font-size:13px;width:28%}
.ctab td .mono{font-size:13.5px}
.cbar{height:5px;border-radius:3px;background:var(--navy);margin-top:5px}
.cwrap{overflow-x:auto}

#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}
#loader div{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
#loader b{font-family:var(--f-display);font-weight:400;font-size:40px;color:var(--fg)}
#loader b i{color:var(--accent);font-style:normal}
#panelBtn{display:none}


/* small states, pyramid, live media, weather */
.micro{stroke:var(--bg);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.micro:hover{stroke:var(--fg)}
.micro.sel{stroke:var(--accent);stroke-width:2.6}
.micro.dim{opacity:.35}
.pyr{display:flex;flex-direction:column;gap:5px;font-size:12px}
.pyr-h,.pyr-r{display:grid;grid-template-columns:1fr 92px 1fr;gap:8px;align-items:center}
.pyr-h{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pyr-h span:first-child{text-align:right}
.pm,.pf{position:relative;height:16px;background:var(--chip);border-radius:4px;overflow:hidden}
.pm i,.pf i{position:absolute;top:0;bottom:0;border-radius:4px}
.pm i{right:0;background:var(--navy)}
.pf i{left:0;background:var(--accent);opacity:.8}
.pm em,.pf em{position:absolute;top:0;font-style:normal;font-family:var(--f-mono);font-size:10.5px;line-height:16px;color:var(--fg);padding:0 5px}
.pm em{left:0}.pf em{right:0}
.pl{text-align:center;font-family:var(--f-mono);font-size:11.5px;line-height:1.2}
.pl small{display:block;color:var(--muted);font-size:10px}
.media{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.media .coa{width:96px;height:auto;max-height:120px;object-fit:contain;background:var(--chip);border-radius:10px;padding:6px}
.media .aud{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.media audio{width:100%;max-width:340px}
.wx{display:flex;flex-direction:column;gap:10px}
.wx-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wx-now .wx-i{font-size:28px}.wx-now b{font-size:24px;font-weight:500}
.wx-now span:last-child{color:var(--muted);font-size:13px}
.wx-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wx-days div{border:1px solid var(--edge);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;gap:1px;min-width:0}
.wx-days small{color:var(--muted);font-size:10.5px}
.sheetBtn{display:none}

@media (max-width:820px){
  .brand span{display:none}
  .top{flex-wrap:wrap;gap:8px}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  :root{--hdr:108px}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:62%}
  #panel[data-open="false"]{display:none}
  #panelBtn{display:grid;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21}
  #legend{left:auto;right:64px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-width:0;max-width:calc(100vw - 140px)}
  #hint{display:none}
  #drawer{left:0;right:0;bottom:0;top:auto;width:auto;height:84%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #drawer.closing{transform:translateY(110%)}
  #drawer.mini{height:40%}
  .sheetBtn{display:grid;position:absolute;right:56px;top:12px;z-index:2;transition:transform .2s}
  .wx-days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero h2{font-size:26px}
  .flagbox{width:72px}
  .cities,.metric-grid{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{border-bottom:0;padding-bottom:0}
  #tray{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
</style>

</head>

lanes:{n:{en:"Indian Ocean sea lanes",hi:"हिंद महासागर समुद्री मार्ग",mr:"हिंद महासागरातील सागरी मार्ग"},t:"Principal east–west shipping lanes across the Indian Ocean, the Gulf energy route, and the Cape alternative. Indicative.",
 legs:[{k:"lane",c:[[32.55,29.9],[38,20],[43.4,12.6],[50,12.5],[60,13],[73,9],[80.5,5.6],[90,6],[94.5,6.2],[98,5.5],[101.3,2.6],[104,1.3],[110,8],[114,16],[119.5,24],[123,31]]},{k:"lane",c:[[56.3,26.5],[59,23.5],[66,20],[72.8,18.9]]},{k:"lane",c:[[18.47,-34.6],[32,-30],[41.5,-17],[50,-5],[62,5],[73,9]]}]}
};
</script>
<script>(function(){
"use strict";
const I=window.WV_I18N, FL=window.WV_FL, RG=window.WV_REGION, LEX=window.WV_LEX, GROUPS=window.WV_GROUPS, CHOKE=window.WV_CHOKE, CORR=window.WV_CORR;
const BASE=window.WV_BASE||"";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("wv:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("wv:"+k,JSON.stringify(v))}catch(e){}}};
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

const S={lang:store.get("lang","en"),edition:store.get("edition","india"),proj:"flat",color:store.get("color","region"),group:null,
  layers:store.get("layers",{choke:true,imec:false,instc:false,lanes:false}),ptab:"explore",sel:null,tab:"overview",
  fav:store.get("fav",[]),recent:store.get("recent",[]),cmp:[],mxSort:["g",-1]};
let C={},CUR={},LEAD={},GEO={},feats=[],byId={},shards={};
const t=k=>{const v=I[S.lang][k];return v==null?I.en[k]:v};
const tt=k=>(I[S.lang].tabs[k]||I.en.tabs[k]);
const loc=()=>({en:"en-IN",hi:"hi-IN",mr:"mr-IN"}[S.lang]);

/* ---------- names ---------- */
const DN={};
function dn(lang){if(!(lang in DN)){try{DN[lang]=new Intl.DisplayNames([lang],{type:"region"})}catch(e){DN[lang]=null}}return DN[lang]}
function nameOf(k,lang){lang=lang||S.lang;const c=C[k];if(!c){const f=byId[k];return f?f.properties.n:k}
  if(lang!=="en"){const d=dn(lang);try{const n=d&&c.a2&&d.of(c.a2);if(n&&n!==c.a2)return n}catch(e){}}
  return c.n}
function flagEmoji(k){const c=C[k];return c&&c.fl?c.fl:"🏳️"}

/* ---------- formatting ---------- */
const nf=(n,d=0)=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:d,minimumFractionDigits:d});
const W={en:{tr:"trillion",bn:"billion",mn:"million",cr:"crore",lk:"lakh"},hi:{tr:"ट्रिलियन",bn:"बिलियन",mn:"मिलियन",cr:"करोड़",lk:"लाख",arab:"अरब"},mr:{tr:"ट्रिलियन",bn:"बिलियन",mn:"मिलियन",cr:"कोटी",lk:"लाख"}};
function fPop(n){if(n==null)return t("notAvail");const w=W[S.lang];
  if(S.lang==="en"){if(n>=1e9)return (n/1e9).toFixed(2)+" "+w.bn;if(n>=1e6)return (n/1e6).toFixed(1)+" "+w.mn;return nf(n)}
  if(n>=1e7)return nf(n/1e7,1)+" "+w.cr;if(n>=1e5)return nf(n/1e5,1)+" "+w.lk;return nf(n)}
function fPopAlt(n){if(n==null||S.lang!=="en")return "";if(n>=1e7)return nf(n/1e7,1)+" crore";if(n>=1e5)return nf(n/1e5,1)+" lakh";return ""}
function fUsd(bn){if(bn==null)return t("notAvail");const w=W[S.lang];if(bn>=1000)return "$"+(bn/1000).toFixed(2)+" "+w.tr;if(bn>=1)return "$"+bn.toFixed(1)+" "+w.bn;return "$"+Math.round(bn*1000)+" "+w.mn}
function fArea(a){if(!a)return t("notAvail");return nf(a)+" km²"}
function fCompact(v,mode){if(v==null)return "—";if(mode==="population")return fPop(v);if(mode==="gdp")return fUsd(v);if(mode==="gdppc")return "$"+nf(v);if(mode==="area")return nf(v)+" km²";if(mode==="density")return nf(v,v<10?1:0)+" /km²";if(mode==="hdi")return v.toFixed(3);if(mode==="gini")return v.toFixed(1);return String(v)}

/* ---------- metrics ---------- */
const RANKSET=k=>{const c=C[k];return c&&(c.un||["PSE","VAT"].includes(k))};
function metric(k,mode){const c=C[k];if(!c)return null;
  switch(mode){case"population":return c.pop?c.pop[0]:null;case"gdp":return c.gdp?c.gdp[0]:null;case"gdppc":return c.pc?c.pc[0]:null;
  case"area":return c.ar||null;case"hdi":return c.hdi?c.hdi[0]:null;case"gini":return c.gini?c.gini[0]:null;case"density":return c.pop&&c.ar>0?c.pop[0]/c.ar:null;case"shared":return sharedGroups(k).length;default:return null}}
const RANK={};
function rankOf(k,mode){if(mode==="hdi"){const c=C[k];return c&&c.hdi?[c.hdi[1],193]:null}if(!RANK[mode]){const arr=Object.keys(C).filter(RANKSET).map(x=>[x,metric(x,mode)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);RANK[mode]={n:arr.length,r:Object.fromEntries(arr.map((x,i)=>[x[0],i+1]))}}
  const R=RANK[mode];return R.r[k]?[R.r[k],R.n]:null}
function sharedGroups(k){if(k==="IND")return Object.keys(GROUPS).filter(g=>!GROUPS[g].x);return Object.keys(GROUPS).filter(g=>!GROUPS[g].x&&GROUPS[g].m.includes(k)&&GROUPS[g].m.includes("IND"))}
function memberOf(k){return Object.keys(GROUPS).filter(g=>GROUPS[g].m.includes(k))}
function bordersOf(k){const b=(C[k]&&C[k].b||[]).slice();if(S.edition==="india"){if(k==="IND"&&!b.includes("AFG"))b.push("AFG");if(k==="AFG"&&!b.includes("IND"))b.push("IND")}return b}
function distKm(a,b){return Math.round(d3.geoDistance(a,b)*6371)}
const DELHI=[77.21,28.61];

/* ---------- colours ---------- */
let TOK={};
function readTokens(){const cs=getComputedStyle(document.documentElement);["--land","--seq0","--seq1","--accent","--r-af","--r-am","--r-as","--r-eu","--r-oc","--r-an","--chip","--sea"].forEach(v=>TOK[v]=cs.getPropertyValue(v).trim())}
const REGC={Africa:"--r-af",Americas:"--r-am",Asia:"--r-as",Europe:"--r-eu",Oceania:"--r-oc",Antarctic:"--r-an"};
let colorFn=()=>TOK["--land"];
function buildColor(){readTokens();const m=S.color;
  if(m==="region"){colorFn=k=>{const c=C[k];return c&&REGC[c.r]?TOK[REGC[c.r]]:TOK["--land"]};return}
  if(m==="shared"){const sc=d3.scaleLinear().domain([0,6]).range([TOK["--seq0"],TOK["--seq1"]]).interpolate(d3.interpolateLab).clamp(true);
    colorFn=k=>k==="IND"?TOK["--accent"]:(C[k]?sc(metric(k,"shared")):TOK["--land"]);return}
  if(m==="hdi"||m==="gini"){const v=Object.keys(C).map(k=>metric(k,m)).filter(x=>x!=null);const ext=[d3.min(v),d3.max(v)];const sc=d3.scaleLinear().domain(ext).range([TOK["--seq0"],TOK["--seq1"]]).interpolate(d3.interpolateLab);colorFn=k=>{const x=metric(k,m);return x!=null?sc(x):TOK["--chip"]};colorFn.ext=ext;return}
  const vals=Object.keys(C).map(k=>metric(k,m)).filter(v=>v!=null&&v>0);
  const ext=[d3.quantile(vals.slice().sort(d3.ascending),.02)||d3.min(vals),d3.max(vals)];
  const sc=d3.scaleLog().domain(ext).range([TOK["--seq0"],TOK["--seq1"]]).interpolate(d3.interpolateLab).clamp(true);
  colorFn=k=>{const v=metric(k,m);return v!=null&&v>0?sc(v):TOK["--chip"]};colorFn.ext=ext}

/* ---------- map ---------- */
const svg=d3.select("#map");let W_,H_;
const gRoot=svg.append("g"),gSea=gRoot.append("path").attr("class","sea"),gGrat=gRoot.append("path").attr("class","grat"),gLand=gRoot.append("g"),gOver=gRoot.append("g"),gPts=gRoot.append("g");
let proj,path,zoom,curK=1;
const grat=d3.geoGraticule10();
function setupProjection(){W_=innerWidth;H_=innerHeight;svg.attr("viewBox",[0,0,W_,H_]);
  if(S.proj==="flat"){proj=d3.geoEqualEarth().fitExtent([[12,Math.min(110,H_*.12)],[W_-12,H_-12]],{type:"Sphere"})}
  else{const r=Math.min(W_,H_-80)/2.25;proj=d3.geoOrthographic().scale(r).translate([W_/2,H_/2+30]).clipAngle(90).rotate(proj&&proj.rotate&&S._rot?S._rot:[-78,-18,0])}
  path=d3.geoPath(proj)}
function drawAll(){gSea.attr("d",path({type:"Sphere"}));gGrat.attr("d",path(grat));
  gLand.selectAll("path.ctry").attr("d",path);drawOverlays()}
function render(){
  const sel=gLand.selectAll("path.ctry").data(feats,d=>d.id);
  sel.exit().remove();
  sel.enter().append("path").attr("class",d=>"ctry"+(C[d.id]?"":" special")).attr("tabindex",-1)
    .on("mousemove",onHover).on("mouseleave",()=>{$("#tip").hidden=true})
    .on("click",(e,d)=>{e.stopPropagation();openCountry(d.id)})
    .merge(sel).attr("d",path);
  paint();drawOverlays()}
function paint(){gLand.selectAll("path.ctry").attr("fill",d=>colorFn(d.id))
  .classed("sel",d=>d.id===S.sel).classed("dim",d=>S.group?!GROUPS[S.group].m.includes(d.id):false);
  if(S.group){gLand.selectAll("path.ctry").filter(d=>GROUPS[S.group].m.includes(d.id)).attr("fill",d=>d.id==="IND"?TOK["--accent"]:d3.interpolateLab(TOK["--accent"],colorFn(d.id))(.35))}
  gLand.selectAll("path.ctry.sel").raise();gPts.selectAll("circle.micro").attr("fill",d=>colorFn(d.id)).classed("sel",d=>d.id===S.sel).classed("dim",d=>S.group?!GROUPS[S.group].m.includes(d.id):false);legend()}
function visible(ll){if(S.proj==="flat")return true;const r=proj.rotate();return d3.geoDistance(ll,[-r[0],-r[1]])<Math.PI/2-.02}
function drawOverlays(){gOver.selectAll("*").remove();gPts.selectAll("*").remove();
  const addLegs=(key,cls)=>{const g=gOver.append("g").attr("class",cls);CORR[key].legs.forEach(l=>{g.append("path").attr("class",l.k==="lane"?"lane":l.k==="rail"?"leg-rail":"leg-sea").attr("d",path({type:"LineString",coordinates:l.c}))});
    (CORR[key].pts||[]).forEach(p=>{if(!visible(p.ll))return;const xy=proj(p.ll);gPts.append("g").attr("class","port").attr("transform",`translate(${xy})`).append("circle").attr("r",4/curK).append("title").text(p.n)})};
  Object.keys(C).filter(k=>C[k].ar!=null&&C[k].ar>=0&&C[k].ar<2500&&(C[k].un||k==="VAT")&&(C[k].capll||C[k].ll)).forEach(k=>{const c=C[k];const p=c.capll?[c.capll[1],c.capll[0]]:[c.ll[1],c.ll[0]];if(!visible(p))return;const xy=proj(p);
    gPts.append("circle").datum({id:k}).attr("class","micro"+(k===S.sel?" sel":"")).attr("cx",xy[0]).attr("cy",xy[1]).attr("r",3.4/curK).attr("fill",colorFn(k)).on("click",e=>{e.stopPropagation();openCountry(k)}).on("mousemove",e=>onHover(e,{id:k})).on("mouseleave",()=>{$("#tip").hidden=true})});
  if(S.layers.lanes)addLegs("lanes","lanes");
  if(S.layers.imec)addLegs("imec","imec");
  if(S.layers.instc)addLegs("instc","instc");
  if(S.layers.choke){CHOKE.forEach(c=>{if(!visible(c.ll))return;const xy=proj(c.ll);const g=gPts.append("g").attr("class","choke").attr("transform",`translate(${xy})`)
      .on("mousemove",e=>tip(e,`<b>${esc(c.n[S.lang])}</b><span>${esc(c.t)}</span>`)).on("mouseleave",()=>{$("#tip").hidden=true});
    g.append("circle").attr("class","ring").attr("r",7/curK);g.append("circle").attr("class","core").attr("r",4/curK)})}}
function onHover(e,d){const k=d.id,c=C[k];let line="";
  if(!c)line=t("special");else if(["region"].includes(S.color))line=(RG[S.lang][c.r]||c.r)+(c.sr?" · "+c.sr:"");
  else if(S.color==="shared"){const g=sharedGroups(k);line=k==="IND"?t("india"):(g.length?g.map(x=>GROUPS[x].n[S.lang]).join(" · "):"0")}
  else line=fCompact(metric(k,S.color),S.color);
  tip(e,`<b>${esc(flagEmoji(k))} ${esc(nameOf(k))}</b><span>${esc(line)}</span>`)}
function tip(e,html){const el=$("#tip");el.innerHTML=html;el.hidden=false;const x=Math.min(e.clientX+14,innerWidth-el.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-el.offsetHeight-8);el.style.left=x+"px";el.style.top=y+"px"}

function attachInteraction(){svg.on(".zoom",null).on(".drag",null);
  if(S.proj==="flat"){zoom=d3.zoom().scaleExtent([1,16]).clickDistance(4).translateExtent([[-W_,-H_],[W_*2,H_*2]])
      .on("zoom",e=>{gRoot.attr("transform",e.transform);if(Math.abs(e.transform.k-curK)>.01){curK=e.transform.k;gPts.selectAll("circle.core,.port circle").attr("r",4/curK);gPts.selectAll("circle.micro").attr("r",3.4/curK);gPts.selectAll("circle.ring").attr("r",7/curK)}});
    svg.call(zoom).on("dblclick.zoom",null);svg.call(zoom.transform,d3.zoomIdentity)}
  else{gRoot.attr("transform",null);curK=1;
    let raf=0;const redraw=()=>{raf=0;drawAll()};
    svg.call(d3.drag().clickDistance(4).on("drag",e=>{const r=proj.rotate(),k=75/proj.scale();proj.rotate([r[0]+e.dx*k,Math.max(-80,Math.min(80,r[1]-e.dy*k)),0]);S._rot=proj.rotate();if(!raf)raf=requestAnimationFrame(redraw)}));
    svg.on("wheel.globe",e=>{e.preventDefault();const s=Math.max(150,Math.min(3000,proj.scale()*(e.deltaY<0?1.08:.93)));proj.scale(s);if(!raf)raf=requestAnimationFrame(redraw)},{passive:false})}}
function zoomBy(f){if(S.proj==="flat")svg.transition().duration(RM?0:300).call(zoom.scaleBy,f);else{proj.scale(Math.max(150,Math.min(3000,proj.scale()*f)));drawAll()}}
function resetView(){if(S.proj==="flat")svg.transition().duration(RM?0:600).call(zoom.transform,d3.zoomIdentity);else{proj.rotate([-78,-18,0]);S._rot=null;setupGlobeScale();drawAll()}}
function setupGlobeScale(){proj.scale(Math.min(W_,H_-80)/2.25)}
function viewCentre(){const desk=innerWidth>820;const L=desk?360:0,Rr=desk&&S.sel?Math.min(560,innerWidth-32)+24:0;
  return {ox:L+(W_-L-Rr)/2,oy:desk?H_/2+30:(S.sel?Math.max(130,H_*.16)/1+0:H_/2),aw:W_-L-Rr,ah:desk?H_-140:(S.sel?H_*.16:H_-160),desk}}
function flyTo(k){const f=byId[k];if(!f)return;const c=C[k];
  const centre=c&&c.ll?[c.ll[1],c.ll[0]]:d3.geoCentroid(f);const v=viewCentre();
  if(S.proj==="flat"){let [[x0,y0],[x1,y1]]=path.bounds(f);const wide=(x1-x0)>W_*.5;
    let cx,cy,s;if(wide||!isFinite(x0)){[cx,cy]=proj(centre);s=2}else{cx=(x0+x1)/2;cy=(y0+y1)/2;s=.8/Math.max((x1-x0)/v.aw,(y1-y0)/Math.max(v.ah,120))}
    s=Math.max(1,Math.min(v.desk?8:4,s));
    svg.transition().duration(RM?0:900).call(zoom.transform,d3.zoomIdentity.translate(v.ox,v.oy).scale(s).translate(-cx,-cy))}
  else{const r0=proj.rotate(),r1=[-centre[0],-centre[1],0];const ip=d3.interpolate(r0,r1);
    d3.transition().duration(RM?0:900).tween("rot",()=>x=>{proj.rotate(ip(x));S._rot=proj.rotate();drawAll()})}}

/* ---------- legend ---------- */
function legend(){const el=$("#legend");const m=S.color;let h=`<h4>${esc(t(m==="shared"?"shared":m))}</h4>`;
  if(m==="region"){h+=`<div class="cats">`+Object.keys(REGC).filter(r=>r!=="Antarctic").map(r=>`<span><i style="background:${TOK[REGC[r]]}"></i>${esc(RG[S.lang][r])}</span>`).join("")+`</div><div class="src">${esc(t("legendSrc"))}: UN M49 (world-countries)</div>`}
  else if(m==="shared"){h+=`<div class="ramp" style="background:linear-gradient(90deg,${TOK["--seq0"]},${TOK["--seq1"]})"></div><div class="ends"><span>0</span><span>6+</span></div><div class="src">Quad, BRICS, SCO, G20, I2U2, IMEC, BIMSTEC, SAARC, IORA, CSC · mid-2026</div>`}
  else{const e=colorFn.ext||[0,1];const yrs=Object.values(C).map(c=>m==="population"||m==="density"?c.pop&&c.pop[1]:m==="area"?null:c.gdp&&c.gdp[1]).filter(Boolean);
    const yr=yrs.length?(d3.min(yrs)===d3.max(yrs)?d3.max(yrs):`${d3.quantile(yrs.sort(),.1)}–${d3.max(yrs)}`):"";
    const srcTxt=m==="area"?"world-countries (area incl. inland water) · log scale":m==="hdi"?esc(t("hdiSrc")):m==="gini"?"CIA World Factbook (latest year per country) · 0–100, higher = more unequal":(m==="gdp"||m==="gdppc"?"World Bank / CIA World Factbook":esc(t("wb")))+(yr?" · "+yr:"")+" · log scale";
    h+=`<div class="ramp" style="background:linear-gradient(90deg,${TOK["--seq0"]},${TOK["--seq1"]})"></div><div class="ends"><span>${esc(fCompact(e[0],m))}</span><span>${esc(fCompact(e[1],m))}</span></div><div class="src">${srcTxt}</div>`}
  h+=`<div class="src">${esc(S.edition==="india"?t("mapEd"):t("mapEdG"))}</div>`;el.innerHTML=h}

/* ---------- data loading ---------- */
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
async function loadGeo(ed){if(GEO[ed])return GEO[ed];const topo=await getJSON(BASE+(ed==="india"?"geo-india.json":"geo-global.json"));
  const fc=topojson.feature(topo,topo.objects.c);GEO[ed]=fc.features;return GEO[ed]}
async function setEdition(ed){S.edition=ed;store.set("edition",ed);feats=await loadGeo(ed);byId=Object.fromEntries(feats.map(f=>[f.id,f]));gLand.selectAll("path.ctry").remove();render();renderPanel()}
async function shard(k){const L=k[0];if(shards[L])return shards[L];shards[L]=getJSON(BASE+"shard/"+L+".json").catch(e=>{delete shards[L];throw e});return shards[L]}

/* ---------- search ---------- */
let IDX=[];
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function buildIndex(){IDX=Object.keys(C).map(k=>{const c=C[k];const terms=[c.n,c.o,c.nv,k,c.a2,nameOf(k,"hi"),nameOf(k,"mr")];if(k==="IND")terms.push("bharat","bhārat","भारत");return {k,terms:terms.filter(Boolean).map(norm)}})}
let qSel=-1,qItems=[];
function doSearch(){const q=norm($("#q").value.trim());const ul=$("#qres");if(!q){ul.hidden=true;return}
  const sc=[];IDX.forEach(r=>{let best=0;r.terms.forEach(tm=>{if(tm===q)best=Math.max(best,100);else if(tm.startsWith(q))best=Math.max(best,60);else if(tm.includes(q))best=Math.max(best,25)});if(best)sc.push([r.k,best+(C[r.k].pop?Math.log10(C[r.k].pop[0])/10:0)])});
  if(!sc.length&&q.length>=4){const lev=(a,b)=>{const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const tmp=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=tmp}}return d[b.length]};
    IDX.forEach(r=>{const best=Math.min(...r.terms.slice(0,3).map(tm=>lev(q,tm.slice(0,q.length+1))));if(best<=2)sc.push([r.k,10-best])})}
  sc.sort((a,b)=>b[1]-a[1]);qItems=sc.slice(0,8).map(x=>x[0]);qSel=qItems.length?0:-1;
  ul.innerHTML=qItems.length?qItems.map((k,i)=>`<li role="option" data-k="${k}" aria-selected="${i===qSel}"><span>${esc(flagEmoji(k))}</span><span>${esc(nameOf(k))}${S.lang!=="en"?` <span class="note">· ${esc(C[k].n)}</span>`:""}</span><small>${k}</small></li>`).join(""):`<li>${esc(t("noResults"))}</li>`;ul.hidden=false}
function pickSearch(k){$("#qres").hidden=true;$("#q").value="";$("#q").blur();openCountry(k)}

/* ---------- panel ---------- */
const COLOR_MODES=["region","population","density","area","gdp","gdppc","hdi","gini","shared"];
function renderPanel(){["explore","lens","library"].forEach(p=>{const b=$("#pt-"+p);b.textContent=t(p==="lens"?"lens":p);b.setAttribute("aria-selected",S.ptab===p)});
  const pb=$("#pbody");let h="";

    row(t("gdp"),fUsd(ca.gdp&&ca.gdp[0]),fUsd(cb.gdp&&cb.gdp[0]),metric(a,"gdp"),metric(b,"gdp")),row(t("gdppc"),ca.pc?"$"+nf(ca.pc[0]):"—",cb.pc?"$"+nf(cb.pc[0]):"—",metric(a,"gdppc"),metric(b,"gdppc")),
    row(t("hdi"),ca.hdi?`${ca.hdi[0].toFixed(3)} (#${ca.hdi[1]})`:"—",cb.hdi?`${cb.hdi[0].toFixed(3)} (#${cb.hdi[1]})`:"—",metric(a,"hdi"),metric(b,"hdi")),row(t("gini"),ca.gini?ca.gini[0].toFixed(1):"—",cb.gini?cb.gini[0].toFixed(1):"—",metric(a,"gini"),metric(b,"gini")),
    row(FLD("Government type"),g(fa,"government","Government type"),g(fb,"government","Government type")),row(FLD("Life expectancy at birth"),g(fa,"people","Life expectancy at birth"),g(fb,"people","Life expectancy at birth")),
    row(FLD("Literacy"),g(fa,"people","Literacy"),g(fb,"people","Literacy")),row(FLD("Internet users"),g(fa,"infra","Internet users"),g(fb,"infra","Internet users")),
    row(FLD("Military expenditures"),g(fa,"foreign","Military expenditures"),g(fb,"foreign","Military expenditures")),
    row(t("currency"),(ca.cur||[]).map(x=>x[0]).join(", "),(cb.cur||[]).map(x=>x[0]).join(", ")),row(t("tz"),(ca.tz||[]).map(z=>"UTC"+z).join(", "),(cb.tz||[]).map(z=>"UTC"+z).join(", ")),
    row(t("shared"),a==="IND"?t("india"):sharedGroups(a).join(", ")||"—",b==="IND"?t("india"):sharedGroups(b).join(", ")||"—")];
  md.innerHTML=`<div class="mcard" role="dialog" aria-modal="true" aria-label="${esc(t("compare"))}"><button class="icon-btn closeX" id="mClose" aria-label="${esc(t("close"))}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h2>${esc(t("compare"))}</h2><div class="cwrap"><table class="ctab"><thead><tr><th></th><th>${esc(flagEmoji(a))} ${esc(nameOf(a))}</th><th>${esc(flagEmoji(b))} ${esc(nameOf(b))}</th></tr></thead><tbody>${rows.join("")}</tbody></table></div><div class="foot" style="margin-top:12px">${esc(t("dataNote"))}</div></div>`;
  $("#mClose").onclick=()=>{md.hidden=true};md.onclick=e=>{if(e.target===md)md.hidden=true}}

/* ---------- global events ---------- */
function applyLang(){document.documentElement.lang=S.lang;$("#tagline").textContent=t("tag");$("#q").placeholder=t("search");$("#hint").textContent=t("clickHint");
  document.querySelectorAll(".seg [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  renderPanel();legend();renderTray();if(S.sel){const k=S.sel;if(CUR_REC&&CUR_REC.k===k){$("#drawer").innerHTML=heroHTML(k,CUR_REC)+tabsHTML()+`<div class="dbody" id="dbody"></div>`;wireDrawer(k);renderTab()}else openCountry(k)}}
function setTheme(next){const root=document.documentElement;root.setAttribute("data-theme",next);store.set("theme",next);setTimeout(()=>{buildColor();paint()},30)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-color],[data-proj],[data-ed],[data-group],[data-open],[data-choke],[data-hl],[data-sort],.ptabs [data-p]");if(!el)return;
  if(el.dataset.p){S.ptab=el.dataset.p;if(S.ptab==="lens"&&S.color==="region"){S.color="shared";store.set("color",S.color);buildColor();paint()}renderPanel();return}
  if(el.dataset.color){S.color=el.dataset.color;store.set("color",S.color);buildColor();paint();renderPanel();return}
  if(el.dataset.proj){if(S.proj!==el.dataset.proj){S.proj=el.dataset.proj;setupProjection();attachInteraction();render();if(S.sel)flyTo(S.sel)}renderPanel();return}
  if(el.dataset.ed){if(S.edition!==el.dataset.ed)setEdition(el.dataset.ed);return}
  if(el.dataset.group!==undefined&&el.closest("#panel")){S.group=el.dataset.group||null;paint();renderPanel();return}
  if(el.dataset.hl){S.group=S.group===el.dataset.hl?null:el.dataset.hl;paint();renderPanel();renderTab();return}
  if(el.dataset.sort){const f=el.dataset.sort;S.mxSort=S.mxSort[0]===f?[f,-S.mxSort[1]]:[f,f==="n"?1:-1];renderPanel();return}
  if(el.dataset.choke){const c=CHOKE.find(x=>x.id===el.dataset.choke);if(!S.layers.choke){S.layers.choke=true;store.set("layers",S.layers);drawOverlays();renderPanel()}
    if(S.proj==="flat"){const xy=proj(c.ll);{const v=viewCentre();svg.transition().duration(RM?0:900).call(zoom.transform,d3.zoomIdentity.translate(v.ox,v.oy).scale(5).translate(-xy[0],-xy[1]))}}
    else{const ip=d3.interpolate(proj.rotate(),[-c.ll[0],-c.ll[1],0]);d3.transition().duration(RM?0:900).tween("r",()=>x=>{proj.rotate(ip(x));drawAll()})}return}
  if(el.dataset.open){openCountry(el.dataset.open);if(innerWidth<=820)$("#panel").dataset.open="false";return}});
document.addEventListener("change",e=>{const l=e.target.dataset&&e.target.dataset.layer;if(l){S.layers[l]=e.target.checked;store.set("layers",S.layers);drawOverlays()}});
document.querySelectorAll(".seg [data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;store.set("lang",S.lang);applyLang()});
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");setTheme(cur==="dark"?"light":"dark")};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{buildColor();paint()})}catch(e){}
$("#zIn").onclick=()=>zoomBy(1.6);$("#zOut").onclick=()=>zoomBy(1/1.6);$("#zReset").onclick=resetView;
$("#panelBtn").onclick=()=>{const p=$("#panel");p.dataset.open=p.dataset.open==="false"?"true":"false"};
const q=$("#q");q.addEventListener("input",doSearch);q.addEventListener("focus",doSearch);
q.addEventListener("keydown",e=>{const ul=$("#qres");if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!qItems.length)return;qSel=(qSel+(e.key==="ArrowDown"?1:-1)+qItems.length)%qItems.length;ul.querySelectorAll("li").forEach((li,i)=>li.setAttribute("aria-selected",i===qSel))}
  else if(e.key==="Enter"&&qSel>=0)pickSearch(qItems[qSel]);else if(e.key==="Escape"){ul.hidden=true;q.blur()}});
$("#qres").addEventListener("mousedown",e=>{const li=e.target.closest("li[data-k]");if(li){e.preventDefault();pickSearch(li.dataset.k)}});
q.addEventListener("blur",()=>setTimeout(()=>{$("#qres").hidden=true},120));
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==="/"&&!typing){e.preventDefault();q.focus()}else if(e.key==="Escape"&&!typing){if(!$("#modal").hidden)$("#modal").hidden=true;else if(S.sel)closeDrawer()}
  else if(!typing&&(e.key==="+"||e.key==="="))zoomBy(1.6);else if(!typing&&e.key==="-")zoomBy(1/1.6)});
let rs;addEventListener("resize",()=>{clearTimeout(rs);rs=setTimeout(()=>{const keep=S._rot;setupProjection();if(keep&&S.proj==="globe")proj.rotate(keep);attachInteraction();render()},150)});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(!h)return;const [k,tb]=h.split(".");if(k&&k!==S.sel&&(C[k]||byId[k]))openCountry(k,tb)});

/* ---------- boot ---------- */
async function boot(){if(innerWidth<=820)$("#panel").dataset.open="false";const th=store.get("theme",null);if(th)document.documentElement.setAttribute("data-theme",th);
  try{const [c,cur]=await Promise.all([getJSON(BASE+"countries.json"),getJSON(BASE+"curated.json")]);C=c;CUR=cur;LEAD=await getJSON(BASE+"leaders.json").catch(()=>({}));
    feats=await loadGeo(S.edition);byId=Object.fromEntries(feats.map(f=>[f.id,f]))}
  catch(e){$("#loadMsg").innerHTML=esc(I[S.lang].loadErr)+` <button class="morebtn" onclick="location.reload()">${esc(I[S.lang].retry)}</button>`;return}
  buildIndex();buildColor();setupProjection();attachInteraction();render();applyLang();
  $("#loader").hidden=true;
  const h=location.hash.slice(1);if(h){const [k,tb]=h.split(".");if(C[k]||byId[k])openCountry(k,tb)}}
boot();
})();
</script>
